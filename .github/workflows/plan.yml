# Shows the Terraform plan for each environment on pull requests, using the
# account's read-only litelogin-plan role.
#
# Pull requests from forks get no OIDC token from GitHub, so they can't
# assume the role; the job is skipped for them. Never change this workflow
# to pull_request_target, which would hand that token to fork code.

name: Plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/plan.yml"

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    name: Plan ${{ matrix.environment }}
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add qa and prod here once their accounts are bootstrapped.
          - environment: dev
            vars_suffix: DEV
    concurrency:
      group: plan-${{ github.event.pull_request.number }}-${{ matrix.environment }}
      cancel-in-progress: true
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      STATE_BUCKET: ${{ vars[format('TF_STATE_BUCKET_{0}', matrix.vars_suffix)] }}
      REGION: ${{ vars[format('AWS_REGION_{0}', matrix.vars_suffix)] }}
    steps:
      - name: Check variables
        run: |
          [[ -n "$STATE_BUCKET" && -n "$REGION" ]] || { echo "repository variables are missing; run scripts/bootstrap-account.sh --github"; exit 1; }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars[format('AWS_PLAN_ROLE_ARN_{0}', matrix.vars_suffix)] }}
          aws-region: ${{ env.REGION }}

      - name: Build Lambda packages
        run: make package

      - name: Terraform init
        working-directory: infra/envs/${{ matrix.environment }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=litelogin/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${REGION}"

      - name: Terraform plan
        working-directory: infra/envs/${{ matrix.environment }}
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -var "region=${REGION}" -out=plan.tfplan
          {
            echo "## Terraform plan: ${ENVIRONMENT}"
            echo '```'
            terraform show -no-color plan.tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
