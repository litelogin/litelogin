# Deploys main after CI passes: dev first, then (once bootstrapped) qa and prod.
#
# Each environment runs in its own GitHub environment, so prod waits for
# approval. Can also be started by hand from the Actions tab (main only:
# the environments only allow the main branch).

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  dev:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: ./.github/workflows/_apply.yml
    with:
      environment: dev
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  # Enable qa and prod after bootstrapping their accounts
  # (scripts/bootstrap-account.sh qa|prod --github) and adding
  # infra/envs/qa and infra/envs/prod:
  #
  # qa:
  #   needs: dev
  #   uses: ./.github/workflows/_apply.yml
  #   with:
  #     environment: qa
  #     ref: ${{ github.event.workflow_run.head_sha || github.sha }}
  #
  # prod:
  #   needs: qa
  #   uses: ./.github/workflows/_apply.yml
  #   with:
  #     environment: prod
  #     ref: ${{ github.event.workflow_run.head_sha || github.sha }}
