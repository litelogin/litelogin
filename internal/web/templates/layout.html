{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} · {{.Brand}}</title>
<style nonce="{{.Nonce}}">
:root{--primary:{{.Theme.Primary}};--bg:{{.Theme.Background}};--fg:#18181b;--muted:#52525b;--card:#fff;--line:#d4d4d8;--err:#b91c1c;--ok:#166534}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px}
main{width:100%;max-width:400px;background:var(--card);border-radius:12px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 24px;font-weight:600}
.brand img{max-height:40px;max-width:160px}
h1{font-size:22px;margin:0 0 20px}
label{display:block;font-size:14px;font-weight:500;margin:16px 0 6px}
input[type=email],input[type=password]{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:8px}
input:focus{outline:2px solid var(--primary);outline-offset:1px}
button{width:100%;margin-top:24px;padding:11px;font:inherit;font-weight:600;color:#fff;background:var(--primary);border:0;border-radius:8px;cursor:pointer}
.msg{padding:10px 12px;border-radius:8px;font-size:14px;margin:0 0 16px}
.error{background:#fef2f2;color:var(--err)}
.notice{background:#f0fdf4;color:var(--ok)}
.links{margin-top:20px;font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
a{color:var(--primary)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
dl{margin:0}dt{font-size:13px;color:var(--muted)}dd{margin:0 0 12px}
</style>
</head>
<body>
<main>
<div class="brand">{{if .Theme.LogoURL}}<img src="{{.Theme.LogoURL}}" alt="">{{end}}<span>{{.Brand}}</span></div>
<h1>{{.Title}}</h1>
{{if .Error}}<p class="msg error" role="alert">{{.Error}}</p>{{end}}
{{if .Notice}}<p class="msg notice" role="status">{{.Notice}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
