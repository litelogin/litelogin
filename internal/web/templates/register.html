{{define "content"}}
<form method="post" action="/register">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="email">Email</label>
<input id="email" name="email" type="email" value="{{.Email}}" autocomplete="email" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="{{.MinPassword}}" required>
<p class="hint">At least {{.MinPassword}} characters.</p>
<button type="submit">Create account</button>
</form>
<div class="links"><a href="/login">Already have an account? Sign in</a></div>
{{end}}
