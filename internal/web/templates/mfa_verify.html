{{define "content"}}
<form method="post" action="/login/2fa">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="code">Code from your authenticator app</label>
<input id="code" name="code" type="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" maxlength="40" required autofocus>
<p class="hint">Lost your app? Enter one of your recovery codes instead.</p>
<button type="submit">Sign in</button>
</form>
<div class="links"><a href="/login">Cancel</a></div>
{{end}}
