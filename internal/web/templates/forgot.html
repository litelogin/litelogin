{{define "content"}}
<p class="hint">Enter your account's email and we'll send you a link to choose a new password.</p>
<form method="post" action="/password/forgot">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="email">Email</label>
<input id="email" name="email" type="email" value="{{.Email}}" autocomplete="username" required autofocus>
<button type="submit">Send reset link</button>
</form>
<div class="links"><a href="/login">Back to sign in</a></div>
{{end}}
