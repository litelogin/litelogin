{{define "content"}}
<form method="post" action="/login">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="email">Email</label>
<input id="email" name="email" type="email" value="{{.Email}}" autocomplete="username" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
<div class="links"><a href="/password/forgot">Forgot your password?</a>{{if .Registration}}<a href="/register">Create an account</a>{{end}}</div>
{{end}}
